<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collection par édition — MTG Portfolio</title><link rel="stylesheet" href="style.css">
<style>
.checklist-wrap{max-width:1450px;margin:30px auto;padding:0 18px}.checklist-controls{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0;align-items:center}.checklist-controls input,.checklist-controls select{padding:9px;min-width:160px}.checklist-table{width:100%;border-collapse:collapse}.checklist-table th,.checklist-table td{padding:10px;border-bottom:1px solid #7775;text-align:left}.checklist-table img{width:50px;border-radius:4px}.checklist-table th{position:sticky;top:0;background:var(--card-bg,#242424);color:inherit}.checklist-scroll{overflow:auto}.checklist-muted{opacity:.7}.checklist-progress{width:100%;max-width:300px;height:10px}.checklist-warning{border-left:3px solid #c77;padding:10px;margin:12px 0}.checklist-back{display:inline-block;margin:10px 0}
</style></head><body>
<header><h1>MTG Portfolio</h1><p>Collection par édition</p></header>
<main class="checklist-wrap"><a class="checklist-back" href="index.html">← Retour au portefeuille</a>
<h2>Collection par édition</h2><p id="checklist-status">Chargement du catalogue…</p>
<div class="checklist-controls"><label>Édition <select id="checklist-edition"></select></label><label>Afficher <select id="checklist-mode"><option value="all">Toutes les cartes</option><option value="owned">Possédées</option><option value="missing">Manquantes</option></select></label><label>Recherche <input id="checklist-search" placeholder="Nom ou variante"></label></div>
<div id="checklist-summary"></div><div id="checklist-warnings"></div>
<div class="checklist-scroll"><table class="checklist-table"><thead><tr><th>Illustration</th><th>Carte / variante</th><th>N°</th><th>Qté</th><th>NM</th><th>EX</th><th>GD</th><th>LP</th><th>PL</th><th>PO</th><th>Meilleur état</th></tr></thead><tbody id="checklist-body"></tbody></table></div>
</main><script src="edition-checklist.js" defer></script></body></html>
