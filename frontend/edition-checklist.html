<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collection par édition — MTG Portfolio</title><link rel="stylesheet" href="style.css?v=checklist-integrated-1">

<style>
.edition-checklist-page .checklist-filter-row th{position:sticky;top:38px;z-index:2;background:#202636;padding:6px}
.edition-checklist-page .checklist-filter-row input,.edition-checklist-page .checklist-filter-row select{width:100%;min-width:65px;max-width:200px;background:#111827;color:#f5f5f5;border:1px solid #475269;border-radius:6px;padding:7px;font-size:12px}
.edition-checklist-page .checklist-sort{background:transparent;border:0;color:inherit;font:inherit;font-weight:700;cursor:pointer;padding:4px 0;text-align:left;white-space:nowrap}
.edition-checklist-page .checklist-sort:hover,.edition-checklist-page .checklist-sort[aria-sort="ascending"],.edition-checklist-page .checklist-sort[aria-sort="descending"]{color:#7fb7ff}
.edition-checklist-page .checklist-sort::after{content:" ⇅";opacity:.55}
.edition-checklist-page .checklist-sort[aria-sort="ascending"]::after{content:" ↑";opacity:1}
.edition-checklist-page .checklist-sort[aria-sort="descending"]::after{content:" ↓";opacity:1}
.edition-checklist-page .checklist-reset{background:#202636;color:#f5f5f5;border:1px solid #475269;border-radius:8px;padding:9px 13px;cursor:pointer}
.edition-checklist-page .checklist-reset:hover{border-color:#7fb7ff}
.edition-checklist-page .checklist-table th{z-index:3;background:#202636}
.edition-checklist-page .checklist-table{min-width:1250px}
.edition-checklist-page .checklist-price-range{display:flex;gap:4px;min-width:130px}
.edition-checklist-page .checklist-price-range input{min-width:0;width:68px;max-width:90px}
.edition-checklist-page .checklist-price{white-space:nowrap;font-variant-numeric:tabular-nums}
.edition-checklist-page .checklist-group-heading td{background:#28364b;color:#e9edf7;font-weight:700;padding:11px 12px;border-top:2px solid #5b7594}
.edition-checklist-page .checklist-table th:nth-child(10),.edition-checklist-page .checklist-table td:nth-child(10){border-left:2px solid #5b7594;background-color:rgba(127,183,255,.055);font-weight:700}
.edition-checklist-page .checklist-grade-breakdown{display:flex;flex-wrap:wrap;gap:7px 10px;margin:12px 0 8px;align-items:center}
.edition-checklist-page .checklist-grade-breakdown strong{margin-right:5px}
.edition-checklist-page .checklist-grade-chip{display:inline-flex;gap:5px;align-items:center;padding:5px 9px;background:#202c3e;border:1px solid #46566d;border-radius:7px;font-size:12px}
.edition-checklist-page .checklist-grade-chip b{color:#a8d1ff}
.edition-checklist-page .checklist-grade-note{font-size:12px;color:#aeb4c2;margin:3px 0 12px}
.edition-checklist-page .checklist-rl{font-weight:700;color:#f0c674}
@media(max-width:700px){.edition-checklist-page .checklist-filter-row th{top:36px}}
</style>
</head><body class="edition-checklist-page">
<header><h1>MTG Portfolio</h1><p>Collection par édition</p></header>
<nav class="tabs" aria-label="Navigation principale">
  <button class="tab-button" onclick="window.location.href='index.html'">📊 Général</button>
  <button class="tab-button" onclick="window.location.href='index.html#tab-investment-analysis'">📈 Analyse investissements</button>
  <button class="tab-button" onclick="window.location.href='index.html#tab-opportunities'">📡 Radar d'achat</button>
  <button class="tab-button" onclick="window.location.href='index.html#tab-collection'">🃏 Ma collection</button>
  <button class="tab-button active" aria-current="page">📚 Collection par édition</button>
  <button class="tab-button" onclick="window.location.href='market-observations.html'">📊 Observations Marché</button>
  <button class="tab-button" onclick="window.location.href='admin.html'">⚙️ Administration</button>
</nav>
<main class="checklist-wrap"><a class="checklist-back" href="index.html">← Retour au portefeuille</a>
<h2>Collection par édition</h2><p id="checklist-status">Chargement du catalogue…</p>
<div class="checklist-controls"><label>Édition <select id="checklist-edition"></select></label><label>Afficher <select id="checklist-mode"><option value="all">Toutes les cartes</option><option value="owned">Possédées</option><option value="missing">Manquantes</option></select></label><label>Type <select id="checklist-category"><option value="all">Normales + spéciales</option><option value="normal">Cartes normales</option><option value="special">Spéciales / variantes</option><option value="token">Tokens</option></select></label><label>Recherche <input id="checklist-search" placeholder="Nom ou variante"></label><button type="button" id="checklist-reset" class="checklist-reset">Réinitialiser les filtres</button></div>
<div id="checklist-summary"></div><div id="checklist-warnings"></div>
<div class="checklist-scroll"><table class="checklist-table"><thead><tr><th>Illustration</th><th><button type="button" class="checklist-sort" data-sort="name" aria-sort="none">Carte / variante</button></th><th><button type="button" class="checklist-sort" data-sort="number" aria-sort="none">N°</button></th><th><button type="button" class="checklist-sort" data-sort="NM" aria-sort="none">NM</button></th><th><button type="button" class="checklist-sort" data-sort="EX" aria-sort="none">EX</button></th><th><button type="button" class="checklist-sort" data-sort="GD" aria-sort="none">GD</button></th><th><button type="button" class="checklist-sort" data-sort="LP" aria-sort="none">LP</button></th><th><button type="button" class="checklist-sort" data-sort="PL" aria-sort="none">PL</button></th><th><button type="button" class="checklist-sort" data-sort="PO" aria-sort="none">PO</button></th><th><button type="button" class="checklist-sort" data-sort="owned" aria-sort="none">Qté</button></th><th><button type="button" class="checklist-sort" data-sort="reserved" aria-sort="none">Reserved List</button></th><th><button type="button" class="checklist-sort" data-sort="best" aria-sort="none">Meilleur état</button></th><th><button type="button" class="checklist-sort" data-sort="price" aria-sort="none" title="Prix indicatif Scryfall en euros, non ajusté à l’état">Prix indicatif (€)</button></th></tr><tr class="checklist-filter-row"><th></th><th><input id="checklist-filter-name" aria-label="Filtrer par nom" placeholder="Nom / variante"></th><th><input id="checklist-filter-number" aria-label="Filtrer par numéro" placeholder="N°"></th><th><select id="checklist-filter-NM" aria-label="Filtrer état NM"><option value="all">Tous</option><option value="yes">≥ 1</option><option value="no">0</option></select></th><th><select id="checklist-filter-EX" aria-label="Filtrer état EX"><option value="all">Tous</option><option value="yes">≥ 1</option><option value="no">0</option></select></th><th><select id="checklist-filter-GD" aria-label="Filtrer état GD"><option value="all">Tous</option><option value="yes">≥ 1</option><option value="no">0</option></select></th><th><select id="checklist-filter-LP" aria-label="Filtrer état LP"><option value="all">Tous</option><option value="yes">≥ 1</option><option value="no">0</option></select></th><th><select id="checklist-filter-PL" aria-label="Filtrer état PL"><option value="all">Tous</option><option value="yes">≥ 1</option><option value="no">0</option></select></th><th><select id="checklist-filter-PO" aria-label="Filtrer état PO"><option value="all">Tous</option><option value="yes">≥ 1</option><option value="no">0</option></select></th><th><select id="checklist-filter-owned" aria-label="Filtrer par quantité"><option value="all">Toutes</option><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4+">4+</option></select></th><th><select id="checklist-filter-reserved" aria-label="Filtrer Reserved List"><option value="all">Toutes</option><option value="yes">RL</option><option value="no">Hors RL</option><option value="unknown">À vérifier</option></select></th><th><select id="checklist-filter-best" aria-label="Filtrer par état minimum"><option value="all">Tous</option><option value="NM">NM ou mieux</option><option value="EX">EX ou mieux</option><option value="GD">GD ou mieux</option><option value="LP">LP ou mieux</option><option value="PL">PL ou mieux</option><option value="PO">PO ou mieux</option><option value="none">Aucun état</option></select></th><th><div class="checklist-price-range"><input id="checklist-price-min" type="number" min="0" step="0.01" placeholder="Min €" aria-label="Prix minimum en euros"><input id="checklist-price-max" type="number" min="0" step="0.01" placeholder="Max €" aria-label="Prix maximum en euros"></div></th></tr></thead><tbody id="checklist-body"></tbody></table></div>
</main><script src="edition-checklist.js?v=best-grade-breakdown-1" defer></script></body></html>
