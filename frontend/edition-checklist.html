<!DOCTYPE html>

<html lang="fr"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Collection par édition — MTG Portfolio</title><link href="style.css?v=checklist-integrated-1" rel="stylesheet"/>
<style>
.edition-checklist-page .checklist-filter-row th{position:sticky;top:38px;z-index:2;background:#202636;padding:6px}
.edition-checklist-page .checklist-filter-row input,.edition-checklist-page .checklist-filter-row select{width:100%;min-width:65px;max-width:200px;background:#111827;color:#f5f5f5;border:1px solid #475269;border-radius:6px;padding:7px;font-size:12px}
.edition-checklist-page .checklist-sort{background:transparent;border:0;color:inherit;font:inherit;font-weight:700;cursor:pointer;padding:4px 0;text-align:left;white-space:nowrap}
.edition-checklist-page .checklist-sort:hover,.edition-checklist-page .checklist-sort[aria-sort="ascending"],.edition-checklist-page .checklist-sort[aria-sort="descending"]{color:#7fb7ff}
.edition-checklist-page .checklist-sort::after{content:" ⇅";opacity:.55}
.edition-checklist-page .checklist-sort[aria-sort="ascending"]::after{content:" ↑";opacity:1}
.edition-checklist-page .checklist-sort[aria-sort="descending"]::after{content:" ↓";opacity:1}
.edition-checklist-page .checklist-reset{background:#202636;color:#f5f5f5;border:1px solid #475269;border-radius:8px;padding:9px 13px;cursor:pointer}
.edition-checklist-page .checklist-reset:hover{border-color:#7fb7ff}
.edition-checklist-page .checklist-table th{z-index:3;background:#202636}
.edition-checklist-page .checklist-table{min-width:1050px}
.edition-checklist-page .checklist-price-range{display:flex;gap:4px;min-width:130px}
.edition-checklist-page .checklist-price-range input{min-width:0;width:68px;max-width:90px}
.edition-checklist-page .checklist-price{white-space:nowrap;font-variant-numeric:tabular-nums}
.edition-checklist-page .checklist-group-heading td{background:#28364b;color:#e9edf7;font-weight:700;padding:11px 12px;border-top:2px solid #5b7594}
.edition-checklist-page .checklist-table th:nth-child(5),.edition-checklist-page .checklist-table td:nth-child(5){background-color:rgba(127,183,255,.055);font-weight:700}
.edition-checklist-page .checklist-table th:nth-child(7),.edition-checklist-page .checklist-table td:nth-child(7){border-left:2px solid #5b7594}
.edition-checklist-page .checklist-table th:nth-child(3),.edition-checklist-page .checklist-table td:nth-child(3){width:48px;min-width:48px;max-width:48px;padding-left:5px;padding-right:5px;text-align:center}
.edition-checklist-page #checklist-filter-number{min-width:0;width:100%;max-width:42px;padding:5px 2px;text-align:center}
.edition-checklist-page .checklist-table th:nth-child(n+4):nth-child(-n+12),.edition-checklist-page .checklist-table td:nth-child(n+4):nth-child(-n+12){padding-left:6px;padding-right:6px;text-align:center}
.edition-checklist-page .checklist-filter-row th:nth-child(n+4):nth-child(-n+12) select{min-width:0;width:100%;max-width:100%;padding:5px 2px;font-size:11px}
.edition-checklist-page .checklist-table th:nth-child(4){min-width:68px}
.edition-checklist-page .checklist-table th:nth-child(6){min-width:88px}
.edition-checklist-page .checklist-grade-breakdown{display:flex;flex-wrap:wrap;gap:5px 12px;margin:7px 0;align-items:center}
.edition-checklist-page .checklist-grade-breakdown strong{margin-right:5px}
.edition-checklist-page .checklist-grade-chip{display:inline;white-space:nowrap;font-size:12px}
.edition-checklist-page .checklist-grade-chip b{color:#a8d1ff}
.edition-checklist-page .checklist-grade-note{font-size:12px;color:#aeb4c2;margin:3px 0 12px}
.edition-checklist-page .checklist-rl{font-weight:700;color:#f0c674}
@media(max-width:700px){.edition-checklist-page .checklist-filter-row th{top:36px}}
</style>

<div class="checklist-controls"><label>Édition <select id="checklist-edition"></select></label><label>Afficher <select id="checklist-mode"><option value="all">Toutes les cartes</option><option value="owned">Possédées</option><option value="missing">Manquantes</option></select></label><label>Type <select id="checklist-category"><option value="all">Normales + spéciales</option><option value="normal">Cartes normales</option><option value="special">Spéciales / variantes</option><option value="token">Tokens</option></select></label><label>Recherche <input id="checklist-search" placeholder="Nom ou variante"/></label><button class="checklist-reset" id="checklist-reset" type="button">Réinitialiser les filtres</button></div>

</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4+">4+</option></select></th><th><select aria-label="Filtrer par état minimum" id="checklist-filter-best"><option value="all">Tous</option><option value="NM">NM ou mieux</option><option value="EX">EX ou mieux</option><option value="GD">GD ou mieux</option><option value="LP">LP ou mieux</option><option value="PL">PL ou mieux</option><option value="PO">PO ou mieux</option><option value="none">Aucun état</option></select></th><th><select aria-label="Filtrer état NM" id="checklist-filter-NM"><option value="all">Tous</option><option value="yes">≥ 1</option><option value="no">0</option></select></th><th><select aria-label="Filtrer état EX" id="checklist-filter-EX"><option value="all">Tous</option><option value="yes">≥ 1</option><option value="no">0</option></select></th><th><select aria-label="Filtrer état GD" id="checklist-filter-GD"><option value="all">Tous</option><option value="yes">≥ 1</option><option value="no">0</option></select></th><th><select aria-label="Filtrer état LP" id="checklist-filter-LP"><option value="all">Tous</option><option value="yes">≥ 1</option><option value="no">0</option></select></th><th><select aria-label="Filtrer état PL" id="checklist-filter-PL"><option value="all">Tous</option><option value="yes">≥ 1</option><option value="no">0</option></select></th><th><select aria-label="Filtrer état PO" id="checklist-filter-PO"><option value="all">Tous</option><option value="yes">≥ 1</option><option value="no">0</option></select></th><th><div class="checklist-price-range"><input aria-label="Prix minimum en euros" id="checklist-price-min" min="0" placeholder="Min €" step="0.01" type="number"/><input aria-label="Prix maximum en euros" id="checklist-price-max" min="0" placeholder="Max €" step="0.01" type="number"/></div></th></tr></thead><tbody id="checklist-body"></tbody></table></div>
</main><script defer="" src="edition-checklist.js?v=best-grade-breakdown-1"></script></body></html>
