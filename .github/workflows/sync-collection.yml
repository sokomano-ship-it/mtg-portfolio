name: Sync Collection from Excel

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mtg-portfolio-data-writer
  cancel-in-progress: false

jobs:
  sync-collection:
    runs-on: ubuntu-latest

    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      # ============================================================
      # READ ONLY FROM TURSO
      # ============================================================

      - name: Hydrate SQLite database from Turso
        run: node backend/hydrateSQLiteFromTursoProduction.js

      - name: Rebuild estimated price history from Turso
        run: node backend/exportEstimatedPriceHistoryFromTurso.js

      - name: Sync observations from Turso
        run: node backend/syncMarketDataFromTurso.js

      - name: Rebuild price history from Turso
        run: node backend/exportPriceHistorySnapshotsFromTurso.js

      - name: Rebuild tracked market history from Turso
        run: node backend/exportTrackedHistoryFromTurso.js

      # ============================================================
      # IMPORT EXCEL
      # ============================================================

      - name: Import collection from Excel
        run: |
          node backend/importExcel.js
          node backend/enrichScryfall.js

      # ============================================================
      # CURRENT MARKET DATA
      # ============================================================

      - name: Update Cardmarket data
        run: |
          npm run update:daily
          npm run resolve:tracked
          npm run update:tracked

      # ============================================================
      # TEMPORARILY DISABLE TURSO WRITES
      # Only inside this GitHub runner.
      # Repository source files are restored afterwards.
      # ============================================================

      - name: Disable Turso writes for this run only
        shell: bash
        run: |
          cp backend/savePriceHistorySnapshot.js /tmp/savePriceHistorySnapshot.js
          cp backend/saveEstimatedPriceSnapshot.js /tmp/saveEstimatedPriceSnapshot.js
          cp backend/exportPortfolioJson.js /tmp/exportPortfolioJson.js

          python3 <<'PY'
          from pathlib import Path
          import re

          # --------------------------------------------------------
          # savePriceHistorySnapshot.js
          # Keep local JSON generation, skip Turso write calls.
          # --------------------------------------------------------
          p = Path("backend/savePriceHistorySnapshot.js")
          s = p.read_text(encoding="utf-8")

          s = re.sub(
              r'await\s+turso\.batch\(\s*statements\s*,\s*"write"\s*\);',
              'console.log("Turso write skipped: price history snapshot.");',
              s
          )

          p.write_text(s, encoding="utf-8")

          # --------------------------------------------------------
          # saveEstimatedPriceSnapshot.js
          # Keep compact frontend history, skip Turso batch writes.
          # --------------------------------------------------------
          p = Path("backend/saveEstimatedPriceSnapshot.js")
          s = p.read_text(encoding="utf-8")

          s = re.sub(
              r'await\s+db\.batch\(\s*batch\s*,\s*"write"\s*\);',
              'console.log("Turso write skipped: estimated snapshot batch.");',
              s
          )

          p.write_text(s, encoding="utf-8")

          # --------------------------------------------------------
          # exportPortfolioJson.js
          # Skip tracked-price-history Turso persistence.
          # --------------------------------------------------------
          p = Path("backend/exportPortfolioJson.js")
          s = p.read_text(encoding="utf-8")

          s, count = re.subn(
              r'(?:await\s+)?saveTrackedPriceHistory\(\s*watchlistCards\s*\);',
              'console.log("Turso write skipped: tracked price history.");',
              s,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "Could not locate saveTrackedPriceHistory(watchlistCards)"
              )

          p.write_text(s, encoding="utf-8")
          PY

      # ============================================================
      # PRICING BUILD
      # ============================================================

      - name: Build pricing without Turso writes
        run: |
          npm run snapshot:prices
          npm run analyze:history
          npm run reference:catalog
          npm run train:pricing
          npm run simulate:pricing
          npm run snapshot:estimated
          npm run export:json
          npm run analyze:estimated-lab

      # ============================================================
      # DEBUG / VALIDATION
      # ============================================================

      - name: Pricing validation
        shell: bash
        run: |
          echo "===== PRICING MODEL SUMMARY ====="

          node - <<'NODE'
          const fs = require("fs");

          const models =
            JSON.parse(
              fs.readFileSync(
                "backend/data/pricingModels.json",
                "utf8"
              )
            );

          let historical = 0;
          let previous = 0;

          for (const model of Object.values(models)) {
            if (!model || !model.byCondition) continue;

            for (const condition of Object.values(model.byCondition)) {
              historical += Number(
                condition?.historicalRatioCount || 0
              );

              if (
                condition?.ratioSource ===
                "previous_model_ratio"
              ) {
                previous++;
              }
            }
          }

          console.log(
            "Ratios construits avec historique :",
            historical
          );

          console.log(
            "Ratios conservés depuis le modèle précédent :",
            previous
          );
          NODE

          echo "===== CANARY CARDS ====="

          node - <<'NODE'
          const fs = require("fs");

          const sim =
            JSON.parse(
              fs.readFileSync(
                "backend/data/pricingSimulation.json",
                "utf8"
              )
            );

          const wanted = [
            "Vaevictis Asmadi",
            "Serendib Efreet",
            "Savannah",
            "Plateau"
          ];

          for (const name of wanted) {
            console.log("\n---", name, "---");

            console.log(
              JSON.stringify(
                sim.filter(
                  row =>
                    String(row.nomCarte || row.nomBase || "")
                      .toLowerCase() ===
                    name.toLowerCase()
                ),
                null,
                2
              )
            );
          }
          NODE

      # ============================================================
      # RESTORE ORIGINAL JS FILES
      # This guarantees Daily remains unchanged.
      # ============================================================

      - name: Restore normal Turso-write scripts
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/savePriceHistorySnapshot.js ]; then
            cp /tmp/savePriceHistorySnapshot.js backend/savePriceHistorySnapshot.js
          fi

          if [ -f /tmp/saveEstimatedPriceSnapshot.js ]; then
            cp /tmp/saveEstimatedPriceSnapshot.js backend/saveEstimatedPriceSnapshot.js
          fi

          if [ -f /tmp/exportPortfolioJson.js ]; then
            cp /tmp/exportPortfolioJson.js backend/exportPortfolioJson.js
          fi

      # ============================================================
      # COMMIT ONLY GENERATED WEB DATA
      # No SQLite -> Turso write while quota is blocked.
      # ============================================================

      - name: Commit updated frontend data
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add frontend/data
          git add backend/data/pricingModels.json
          git add backend/data/pricingSimulation.json
          git add backend/data/referenceCatalog.json
          git add backend/data/missingReferences.json

          if git diff --cached --quiet
          then
            echo "No generated changes to commit."
          else
            git commit -m "Sync collection from Excel"
            git push origin main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy Pages
        uses: actions/deploy-pages@v4