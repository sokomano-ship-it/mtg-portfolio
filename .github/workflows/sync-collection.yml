name: Sync Collection from Excel

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mtg-portfolio-data-writer
  cancel-in-progress: false

jobs:
  sync-collection:
    runs-on: ubuntu-latest

    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      TURSO_MAX_MIRROR_WRITES: 10000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Hydrate SQLite database from Turso
        run: node backend/hydrateSQLiteFromTursoProduction.js

      - name: Rebuild estimated price history from Turso
        run: node backend/exportEstimatedPriceHistoryFromTurso.js

      - name: Sync observations from Turso
        run: node backend/syncMarketDataFromTurso.js

      - name: Rebuild price history from Turso
        run: node backend/exportPriceHistorySnapshotsFromTurso.js

      - name: Rebuild tracked market history from Turso
        run: node backend/exportTrackedHistoryFromTurso.js

      - name: Import collection from Excel
        run: |
          node backend/importExcel.js
          node backend/enrichScryfall.js

      - name: Build portfolio
        run: npm run build:pages

      - name: Check SQLite Turso write budget
        run: node backend/syncSQLiteToTurso.js --dry-run

      - name: Persist SQLite database to Turso
        run: node backend/syncSQLiteToTurso.js

      - name: Commit generated files
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add frontend/data
          git add backend/data/pricingModels.json
          git add backend/data/pricingSimulation.json
          git add backend/data/referenceCatalog.json
          git add backend/data/missingReferences.json

          if git diff --cached --quiet
          then
            echo "No generated changes to commit."
          else
            git commit -m "Sync collection from Excel"
            git push origin main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy Pages
        uses: actions/deploy-pages@v4