name: Sync Collection from Excel

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mtg-portfolio-data-writer
  cancel-in-progress: false

jobs:
  sync-collection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Sync collection and push generated files
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          for attempt in 1 2 3
          do
            echo "Sync attempt ${attempt}/3"

            git fetch origin main
            git reset --hard origin/main

            npm run sync:collection

            git add -A

            if git diff --cached --quiet
            then
              echo "No generated changes to commit."
              break
            fi

            git commit -m "Sync collection from Excel"

            if git push origin main
            then
              echo "Collection synchronized successfully."
              break
            fi

            if [ "$attempt" -eq 3 ]
            then
              echo "Unable to push after 3 attempts."
              exit 1
            fi

            echo "Main changed during generation. Restarting from latest main."
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy Pages
        uses: actions/deploy-pages@v4