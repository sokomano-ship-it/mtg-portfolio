name: Manual Cardmarket Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Hydrate SQLite database from Turso
        run: node backend/hydrateSQLiteFromTursoProduction.js

      - name: Update Cardmarket prices
        run: |
          node backend/updateCardmarketFromPriceGuide.js
          node backend/updatePortfolioValue.js

      - name: Persist SQLite database to Turso
        run: node backend/syncSQLiteToTurso.js